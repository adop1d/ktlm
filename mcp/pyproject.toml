[project]
name = "ktlm-mcp"
version = "1.0.0"
description = "MCP server for KTLM"
requires-python = ">=3.11"
dependencies = ["mcp>=2.3", "httpx>=0.27"]

[project.scripts]
ktlm-mcp = "ktlm_mcp.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["ktlm_mcp"]
