# Secretos ---------------------------------------------------------------
# Ninguno lleva valor por defecto. Arrancar sin ellos tiene que fallar al principio y
# claro, no firmar con algo que esté en el repositorio y que cualquiera pueda leer.
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Server
server.port=${SERVER_PORT:8080}

# Database
spring.datasource.url=${DB_URL:jdbc:postgresql://postgres:5432/postgres}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

# Sin esto no hay techo: el cuerpo llega entero a la memoria antes de tocar nada.
server.tomcat.max-http-form-post-size=${MAX_POST_SIZE:2MB}
server.tomcat.max-swallow-size=${MAX_POST_SIZE:2MB}

# Flyway es la unica fuente del esquema. baseline-on-migrate deja las bases creadas
# antes de adoptarlo en V1, de modo que solo ejecuten las migraciones nuevas.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.locations=classpath:db/migration

# validate: el esquema lo manda Flyway, Hibernate solo comprueba que encaje.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Directorio de archivos todo.txt por usuario. Ahora son del servidor: eso es lo que
# permite que un movil y un servidor MCP vean el mismo archivo.
todo.data-dir=${TODO_DATA_DIR:./data/todo}

# Logging. DEBUG y show-sql imprimen cada consulta y el interior de la autenticacion,
# que en un agregador de logs publico es lo mismo que publicar el contenido.
logging.level.ktm=${LOG_LEVEL:INFO}