# JWT Configuration
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Server
server.port=${SERVER_PORT:8080}

# Database
spring.datasource.url=${DB_URL:jdbc:postgresql://postgres:5432/postgres}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:PLACEHOLDER_LEE_EL_ENV}
spring.datasource.driver-class-name=org.postgresql.Driver

# Flyway es la unica fuente del esquema. baseline-on-migrate deja las bases creadas
# antes de adoptarlo en V1, de modo que solo ejecuten las migraciones nuevas.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.locations=classpath:db/migration

# validate: el esquema lo manda Flyway, Hibernate solo comprueba que encaje.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Logging
logging.level.com.example.taskmanager=${LOG_LEVEL:DEBUG}