server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Enable Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml+rss;

    # El documento nunca se cachea. Sus assets llevan hash en el nombre, así que cachearlos
    # un año es seguro; el documento no, y servirlo viejo hace que la app cargue un bundle
    # que ya no existe en el servidor. Parece un bug de la app y es una cabecera.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    location = / {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files /index.html =404;
    }

    # SPA fallback - all routes go to index.html
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    # Los assets llevan el hash del contenido en el nombre: si cambian, cambia el nombre.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # El service worker cambia en cada build y no lleva hash: si se cachea un año, el
    # navegador se queda con una versión antigua del registro para siempre.
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }
    location = /registerSW.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }
}