# Las dependencias se actualizan solas, en PR y no a la fuerza: un `npm audit fix` un martes
# a las seis de la tarde es una forma cara de romper un despliegue.
#
# Se cubre lo que de verdad depende de fuera: actions, npm, maven y pip. De las cuatro, la
# que más duele quedarse atrás es actions, porque es la que ejecuta código con permisos de
# escritura sobre el repositorio.

version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps

  - package-ecosystem: maven
    directory: /backend
    schedule:
      interval: monthly
    commit-message:
      prefix: deps

  - package-ecosystem: pip
    directory: /mcp
    schedule:
      interval: monthly
    commit-message:
      prefix: deps