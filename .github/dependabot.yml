# Dependencies update on their own, in PRs and never forced: an `npm audit fix` on a
# Tuesday at six in the evening is an expensive way to break a deployment.
#
# It covers what genuinely depends on the outside: actions, npm, maven and pip. Of the
# four, actions is the one that hurts most to fall behind, because it is the one that
# runs code with write permissions over the repository.

version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps

  - package-ecosystem: maven
    directory: /backend
    schedule:
      interval: monthly
    commit-message:
      prefix: deps

  - package-ecosystem: pip
    directory: /mcp
    schedule:
      interval: monthly
    commit-message:
      prefix: deps