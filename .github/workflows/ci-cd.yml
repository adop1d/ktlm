name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Build backend
        run: cd backend && ./mvnw -B clean verify
      - name: Run backend tests
        run: cd backend && ./mvnw -B test

  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: cd frontend && npm ci
      - name: Typecheck frontend
        run: cd frontend && npm run typecheck
      - name: Run frontend tests
        run: cd frontend && npm run test
      - name: Build frontend
        run: cd frontend && npm run build
      - name: Run end-to-end tests
        run: cd frontend && npx playwright install --with-deps chromium && npm run test:e2e

  docker-build:
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    steps:
      - uses: actions/checkout@v4
      # `docker build` and not `docker compose build`, on purpose. Compose interpolates
      # the whole file before doing anything —including `build`— and refuses to start if
      # JWT_SECRET or DB_PASSWORD are missing. None of that applies to building images:
      # the Dockerfiles copy code, and no environment variable reaches the image.
      #
      # The alternative was inventing values in the step so interpolation would pass.
      # It works, but it ties the build to secrets it doesn't use and that nobody should
      # store in the repository just to make a build work.
      - name: Build Docker images
        run: |
          docker build -t ktm-backend:latest ./backend
          docker build -t ktm-frontend:latest ./frontend
          # To push to a registry you would need a prior login:
          #   echo "${{ secrets.REGISTRY_TOKEN }}" | docker login -u "${{ secrets.REGISTRY_USER }}" --password-stdin
          #   docker push ktm-backend:latest
          #   docker push ktm-frontend:latest

      # The .dockerignore is the only thing stopping a .env full of secrets from ending
      # up in a layer, and once it's in a layer, deleting it afterwards is pointless.
      # It deserves a step that checks it.
      #
      # It looks at the frontend's `builder` stage rather than the final image because
      # that's the one doing `COPY . .`: that's where it would slip in. The final image
      # only carries the dist, so checking it would always be green, which is the easiest
      # way to have a test that checks nothing.
      - name: Verify no .env reached the images
        run: |
          docker build --target builder -t ktm-frontend-builder ./frontend
          if docker run --rm --entrypoint sh ktm-frontend-builder -c 'test -e /app/.env'; then
            echo "::error::the .env ended up inside the frontend image"
            exit 1
          fi
          if docker run --rm --entrypoint sh ktm-backend:latest -c 'test -e /app/.env'; then
            echo "::error::the .env ended up inside the backend image"
            exit 1
          fi
          echo "ninguna imagen lleva un .env"