# Variables de entorno. Copia .env.example a .env y rellénalo; docker compose lo lee solo.
#
#   cp .env.example .env
#
# Sin esto, `docker compose up` falla con un mensaje que dice qué falta. Es deliberado:
# arrancar con una contraseña inventada es peor que no arrancar.

services:
  backend:
    build:
      context: ./backend
    environment:
      JWT_SECRET: ${JWT_SECRET:?falta JWT_SECRET en .env — mira .env.example}
      DB_PASSWORD: ${DB_PASSWORD:?falta DB_PASSWORD en .env — mira .env.example}
      DB_URL: ${DB_URL:-jdbc:postgresql://postgres:5432/postgres}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      TODO_DATA_DIR: /app/data/todo
    volumes:
      # El directorio de archivos todo.txt vive fuera del contenedor: si no, al
      # reconstruir la imagen se pierde el archivo de cada usuario.
      - todo-data:/app/data/todo
    ports:
      # Solo en local. Si esto se publica en un servidor, el backend queda exposed con la
      # API entera; delante tiene que haber un proxy con TLS.
      - "127.0.0.1:${SERVER_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - appnet

  frontend:
    build:
      context: ./frontend
    ports:
      - "127.0.0.1:${HTTP_PORT:-80}:80"
    networks:
      - appnet
    depends_on:
      - backend

  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?falta DB_PASSWORD en .env — mira .env.example}
      POSTGRES_DB: ${DB_NAME:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Sin `ports`: el backend está en la misma red y llega como `postgres:5432`.
    # Publicarlo era poner una base con superusuario en todas las interfaces.
    networks:
      - appnet
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

# redis y mongo se quitaron: estaban aprovisionados pero ninguna pieza del backend los
# referencia. Eran imagenes que bajar, puertos ocupados y arranque mas lento para nada.

networks:
  appnet:
    driver: bridge

volumes:
  postgres_data:
  todo-data: