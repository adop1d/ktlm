services:
  backend:
    build:
      context: ./backend
    volumes:
      # El directorio de archivos todo.txt vive fuera del contenedor: si no, al
      # reconstruir la imagen se pierde el archivo de cada usuario.
      - todo-data:/app/data/todo
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - appnet

  frontend:
    build:
      context: ./frontend
    ports:
      - "80:80"
    networks:
      - appnet
    depends_on:
      - backend

  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: PLACEHOLDER_LEE_EL_ENV
      POSTGRES_DB: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - appnet
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

# redis y mongo se quitaron: estaban aprovisionados pero ninguna pieza del backend los
# referencia. Eran imagenes que bajar, puertos ocupados y arranque mas lento para nada.

networks:
  appnet:
    driver: bridge

volumes:
  postgres_data:
  todo-data: